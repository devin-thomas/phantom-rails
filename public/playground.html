<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phantom Rails — Search Playground & Provenance Inspector</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131c2e;
      --card-border: #1e293b;
      --header-bg: #0b1120;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #a855f7;
      --badge-hist: #8b5cf6;
      --badge-synth: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
      --focus-ring: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-width: 320px;
    }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }
    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .header-brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .header-brand p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .header-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-hist { background: rgba(139, 92, 246, 0.2); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.4); }
    .badge-synth { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-green { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-red { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge-blue { background: rgba(56, 189, 248, 0.2); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.4); }
    .nav-link {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .nav-link:hover { text-decoration: underline; }
    .container {
      max-width: 1280px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }
    .search-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .filter-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .filter-group input, .filter-group select {
      background: #090d16;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.5rem 0.65rem;
      border-radius: 0.375rem;
      font-size: 0.85rem;
    }
    .btn-row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--primary);
      color: #090d16;
      font-weight: 600;
      border: none;
      padding: 0.5rem 1.25rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover { background: #334155; }
    .status-banner {
      padding: 0.75rem 1rem;
      border-radius: 0.375rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }
    .status-error { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; }
    .status-info { background: rgba(56, 189, 248, 0.15); border: 1px solid var(--primary); color: #bae6fd; }
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .postings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }
    .posting-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.5rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .posting-card:hover {
      border-color: #334155;
    }
    .card-top h3 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.25rem;
    }
    .card-company {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--primary);
    }
    .card-location {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .card-badges {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }
    .card-excerpt {
      font-size: 0.85rem;
      color: #cbd5e1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-actions {
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pagination-bar {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
    }
    /* Modal / Inspector Drawer */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 1000;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }
    .modal-close:hover { color: var(--text); }
    .prov-section {
      margin-top: 1rem;
      border-top: 1px solid var(--card-border);
      padding-top: 0.75rem;
    }
    .prov-section h4 {
      font-size: 0.9rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    .prov-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .prov-table th, .prov-table td {
      padding: 0.4rem 0.6rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .prov-table th { color: var(--text-muted); }
  </style>
</head>
<body>
  <header>
    <div class="header-brand">
      <h1>Phantom Rails Search Playground</h1>
      <p>High-Assurance Read-Only Search & Provenance Client</p>
    </div>
    <div class="header-meta">
      <span id="badge-health" class="badge badge-green">Health: Loading...</span>
      <span id="badge-rev" class="badge badge-blue">Corpus: ...</span>
      <a href="/docs" class="nav-link">Interactive Docs</a>
      <a href="/openapi.json" class="nav-link">OpenAPI Spec</a>
    </div>
  </header>

  <div class="container">
    <div class="search-panel">
      <form id="search-form" onsubmit="handleSearch(event)">
        <div class="filter-grid">
          <div class="filter-group">
            <label for="f-q">Keywords (q)</label>
            <input type="text" id="f-q" placeholder="e.g. software engineer" autocomplete="off">
          </div>
          <div class="filter-group">
            <label for="f-company">Company</label>
            <input type="text" id="f-company" placeholder="e.g. Acme Corp">
          </div>
          <div class="filter-group">
            <label for="f-location">Location</label>
            <input type="text" id="f-location" placeholder="e.g. Denver, CO">
          </div>
          <div class="filter-group">
            <label for="f-remote">Remote Type</label>
            <select id="f-remote">
              <option value="">Any</option>
              <option value="onsite">Onsite</option>
              <option value="hybrid">Hybrid</option>
              <option value="remote">Remote</option>
              <option value="unknown">Unknown</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="f-salary">Min Annual USD</label>
            <input type="number" id="f-salary" placeholder="e.g. 120000" min="0">
          </div>
          <div class="filter-group">
            <label for="f-sort">Sort Order</label>
            <select id="f-sort">
              <option value="">Default (Relevance if q, Newest otherwise)</option>
              <option value="relevance">Relevance</option>
              <option value="newest">Newest</option>
              <option value="company">Company</option>
              <option value="title">Title</option>
            </select>
          </div>
        </div>
        <div class="btn-row">
          <button type="submit" class="btn" id="btn-search">Search Postings</button>
          <button type="button" class="btn btn-secondary" onclick="resetForm()">Reset Filters</button>
        </div>
      </form>
    </div>

    <!-- Status Banner -->
    <div id="status-banner" class="status-banner" role="status" aria-live="polite"></div>

    <!-- Results Area -->
    <div class="results-header">
      <span id="results-count">Ready</span>
      <span id="results-meta"></span>
    </div>

    <div id="postings-grid" class="postings-grid"></div>

    <div class="pagination-bar">
      <button id="btn-next-page" class="btn btn-secondary" style="display: none;" onclick="loadNextPage()">
        Load Next Page
      </button>
    </div>
  </div>

  <!-- Provenance Inspector Modal -->
  <div id="prov-modal" class="modal-backdrop" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModalDirect()">&times;</button>
      <h2 id="modal-title" style="font-size: 1.25rem; margin-bottom: 0.25rem;">Provenance Inspection</h2>
      <p id="modal-subtitle" style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;"></p>

      <div id="modal-body">
        <p>Loading provenance evidence...</p>
      </div>
    </div>
  </div>

  <script>
    let currentNextCursor = null;
    let currentQueryParams = {};

    window.addEventListener('DOMContentLoaded', () => {
      initMeta();
      loadPostings();
    });

    async function initMeta() {
      try {
        const healthResp = await fetch('/api/v1/health');
        const health = await healthResp.json();
        const bHealth = document.getElementById('badge-health');
        if (health.status === 'ok') {
          bHealth.textContent = 'Health: OK';
          bHealth.className = 'badge badge-green';
        } else {
          bHealth.textContent = 'Health: Degraded';
          bHealth.className = 'badge badge-red';
        }

        const metaResp = await fetch('/api/v1/meta');
        const meta = await metaResp.json();
        const bRev = document.getElementById('badge-rev');
        if (meta.corpus_revision) {
          bRev.textContent = 'Rev: ' + meta.corpus_revision.substring(0, 10);
        }
      } catch (err) {
        document.getElementById('badge-health').textContent = 'API Unavailable';
        document.getElementById('badge-health').className = 'badge badge-red';
      }
    }

    function resetForm() {
      document.getElementById('search-form').reset();
      handleSearch(new Event('submit'));
    }

    async function handleSearch(e) {
      if (e) e.preventDefault();
      currentNextCursor = null;

      const q = document.getElementById('f-q').value.trim();
      const company = document.getElementById('f-company').value.trim();
      const location = document.getElementById('f-location').value.trim();
      const remote = document.getElementById('f-remote').value;
      const salary = document.getElementById('f-salary').value;
      const sort = document.getElementById('f-sort').value;

      currentQueryParams = {};
      if (q) currentQueryParams.q = q;
      if (company) currentQueryParams.company = company;
      if (location) currentQueryParams.location = location;
      if (remote) currentQueryParams.remote_type = remote;
      if (salary) currentQueryParams.min_salary_usd = salary;
      if (sort) currentQueryParams.sort = sort;

      await loadPostings(false);
    }

    async function loadNextPage() {
      if (!currentNextCursor) return;
      await loadPostings(true);
    }

    async function loadPostings(append) {
      const banner = document.getElementById('status-banner');
      const grid = document.getElementById('postings-grid');
      const countLabel = document.getElementById('results-count');
      const btnNext = document.getElementById('btn-next-page');

      banner.style.display = 'none';

      if (!append) {
        grid.textContent = '';
        countLabel.textContent = 'Searching...';
      }

      const params = new URLSearchParams(currentQueryParams);
      params.set('limit', '12');
      if (append && currentNextCursor) {
        params.set('cursor', currentNextCursor);
      }

      try {
        const resp = await fetch('/api/v1/postings?' + params.toString());
        const body = await resp.json();

        if (!resp.ok) {
          banner.className = 'status-banner status-error';
          banner.textContent = (body.error && body.error.message) ? body.error.message : 'Error loading postings';
          banner.style.display = 'block';
          countLabel.textContent = '0 results';
          btnNext.style.display = 'none';
          return;
        }

        const items = body.data || [];
        currentNextCursor = body.page ? body.page.next_cursor : null;

        if (items.length === 0 && !append) {
          countLabel.textContent = '0 postings found';
          banner.className = 'status-banner status-info';
          banner.textContent = 'No postings matched your exact criteria in the active approved corpus.';
          banner.style.display = 'block';
          btnNext.style.display = 'none';
          return;
        }

        renderPostings(items, append);

        countLabel.textContent = `${grid.children.length} postings displayed`;
        document.getElementById('results-meta').textContent = `Sort: ${body.meta.sort || 'default'}`;

        if (currentNextCursor) {
          btnNext.style.display = 'inline-block';
        } else {
          btnNext.style.display = 'none';
        }
      } catch (err) {
        banner.className = 'status-banner status-error';
        banner.textContent = 'Database or API service temporarily unavailable. Please retry later.';
        banner.style.display = 'block';
        countLabel.textContent = 'Error';
        btnNext.style.display = 'none';
      }
    }

    function renderPostings(items, append) {
      const grid = document.getElementById('postings-grid');
      if (!append) grid.textContent = '';

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'posting-card';

        const top = document.createElement('div');
        top.className = 'card-top';

        const title = document.createElement('h3');
        title.textContent = item.title;
        top.appendChild(title);

        const company = document.createElement('div');
        company.className = 'card-company';
        company.textContent = item.company;
        top.appendChild(company);

        const location = document.createElement('div');
        location.className = 'card-location';
        location.textContent = item.location;
        top.appendChild(location);

        const badges = document.createElement('div');
        badges.className = 'card-badges';

        const originBadge = document.createElement('span');
        originBadge.className = 'badge ' + (item.origin_class === 'sanitized_historical' ? 'badge-hist' : 'badge-synth');
        originBadge.textContent = item.origin_class.replace('_', ' ');
        badges.appendChild(originBadge);

        if (item.remote_type && item.remote_type !== 'unknown') {
          const remBadge = document.createElement('span');
          remBadge.className = 'badge badge-blue';
          remBadge.textContent = item.remote_type;
          badges.appendChild(remBadge);
        }

        if (item.salary && item.salary.min) {
          const salBadge = document.createElement('span');
          salBadge.className = 'badge badge-green';
          salBadge.textContent = `$${Math.round(item.salary.min).toLocaleString()} - $${Math.round(item.salary.max || item.salary.min).toLocaleString()} / ${item.salary.period}`;
          badges.appendChild(salBadge);
        }

        if (item.relevance_score != null) {
          const scoreBadge = document.createElement('span');
          scoreBadge.className = 'badge badge-blue';
          scoreBadge.textContent = `Score: ${item.relevance_score}`;
          badges.appendChild(scoreBadge);
        }

        if (item.potential_duplicate) {
          const dupeBadge = document.createElement('span');
          dupeBadge.className = 'badge badge-synth';
          dupeBadge.textContent = 'Potential Duplicate';
          badges.appendChild(dupeBadge);
        }

        top.appendChild(badges);

        if (item.summary_excerpt) {
          const excerpt = document.createElement('p');
          excerpt.className = 'card-excerpt';
          excerpt.textContent = item.summary_excerpt;
          top.appendChild(excerpt);
        }

        card.appendChild(top);

        const actions = document.createElement('div');
        actions.className = 'card-actions';

        const btnInspect = document.createElement('button');
        btnInspect.className = 'btn btn-secondary';
        btnInspect.textContent = 'Inspect Provenance';
        btnInspect.onclick = () => openProvenanceModal(item.id);
        actions.appendChild(btnInspect);

        card.appendChild(actions);
        grid.appendChild(card);
      });
    }

    async function openProvenanceModal(publicId) {
      const modal = document.getElementById('prov-modal');
      const body = document.getElementById('modal-body');
      const sub = document.getElementById('modal-subtitle');
      modal.style.display = 'flex';
      sub.textContent = 'Identifier: ' + publicId;
      body.textContent = 'Fetching reconciliation decisions...';

      try {
        const resp = await fetch(`/api/v1/postings/${encodeURIComponent(publicId)}/provenance`);
        const data = await resp.json();
        const p = data.data;

        body.textContent = '';

        // Merge Evidence Section
        const secMerge = document.createElement('div');
        secMerge.className = 'prov-section';
        const hMerge = document.createElement('h4');
        hMerge.textContent = `Contributing Source Mentions (${p.merge_evidence ? p.merge_evidence.total_mentions : 1})`;
        secMerge.appendChild(hMerge);

        const tblMentions = document.createElement('table');
        tblMentions.className = 'prov-table';
        tblMentions.innerHTML = '<thead><tr><th>Mention Key</th><th>Source Kind</th><th>Domain</th><th>Origin</th></tr></thead>';
        const tbodyM = document.createElement('tbody');

        (p.merge_evidence ? p.merge_evidence.mentions : []).forEach(m => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td><code>${escapeHtml(m.mention_key)}</code></td><td>${escapeHtml(m.source_kind)}</td><td>${escapeHtml(m.source_domain || 'N/A')}</td><td><span class="badge ${m.origin_class === 'sanitized_historical' ? 'badge-hist' : 'badge-synth'}">${escapeHtml(m.origin_class)}</span></td>`;
          tbodyM.appendChild(tr);
        });
        tblMentions.appendChild(tbodyM);
        secMerge.appendChild(tblMentions);
        body.appendChild(secMerge);

        // Field Reconciliations Section
        const secReconcile = document.createElement('div');
        secReconcile.className = 'prov-section';
        const hRec = document.createElement('h4');
        hRec.textContent = 'Field Selection & Reconciliation Decisions';
        secReconcile.appendChild(hRec);

        const tblRec = document.createElement('table');
        tblRec.className = 'prov-table';
        tblRec.innerHTML = '<thead><tr><th>Field</th><th>Chosen Value</th><th>Selection Reason</th><th>Alternatives</th></tr></thead>';
        const tbodyR = document.createElement('tbody');

        (p.field_reconciliation || []).forEach(f => {
          const tr = document.createElement('tr');
          const altCount = (f.alternatives && f.alternatives.length) ? `${f.alternatives.length} overridden` : 'None (clean)';
          tr.innerHTML = `<td><strong>${escapeHtml(f.field_name)}</strong></td><td>${escapeHtml(formatValue(f.chosen_value))}</td><td><code>${escapeHtml(f.selection_reason)}</code></td><td>${escapeHtml(altCount)}</td>`;
          tbodyR.appendChild(tr);
        });
        tblRec.appendChild(tbodyR);
        secReconcile.appendChild(tblRec);
        body.appendChild(secReconcile);

        // Potential Duplicates
        if (p.potential_duplicates && p.potential_duplicates.length > 0) {
          const secDup = document.createElement('div');
          secDup.className = 'prov-section';
          const hDup = document.createElement('h4');
          hDup.textContent = 'Uncertain Duplicates Kept Separate';
          secDup.appendChild(hDup);

          const tblDup = document.createElement('table');
          tblDup.className = 'prov-table';
          tblDup.innerHTML = '<thead><tr><th>Posting ID</th><th>Company</th><th>Reason Code</th></tr></thead>';
          const tbodyD = document.createElement('tbody');
          p.potential_duplicates.forEach(d => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><code>${escapeHtml(d.id)}</code></td><td>${escapeHtml(d.company)}</td><td><code>${escapeHtml(d.reason_code)}</code></td>`;
            tbodyD.appendChild(tr);
          });
          tblDup.appendChild(tbodyD);
          secDup.appendChild(tblDup);
          body.appendChild(secDup);
        }
      } catch (err) {
        body.textContent = 'Failed to load provenance details: ' + err;
      }
    }

    function closeModal(e) {
      if (e.target.id === 'prov-modal') {
        document.getElementById('prov-modal').style.display = 'none';
      }
    }

    function closeModalDirect() {
      document.getElementById('prov-modal').style.display = 'none';
    }

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatValue(val) {
      if (typeof val === 'object' && val !== null) {
        if (val.min) return `$${val.min} - $${val.max} ${val.currency}/${val.period}`;
        return JSON.stringify(val);
      }
      return String(val);
    }
  </script>
</body>
</html>
